[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "questionnaire-autopilot"
version = "0.1.0"
description = "Auto-draft answers to security & vendor questionnaires (SOC 2 / ISO 27001 / CAIQ) straight from your own policy docs, with citations, a confidence score, and a needs-review flag."
authors = [{ name = "Al Amin Bashir Afara", email = "aminafara123@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3,<2",
    "openpyxl>=3.1,<4",
]

[project.scripts]
questionnaire-autopilot = "autopilot:main"

# Single-file module plus its LLM helper.
[tool.hatch.build.targets.wheel]
include = ["autopilot.py", "llm.py"]
